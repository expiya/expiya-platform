<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Temsilî ev ürünü illüstrasyonu</title>
  <desc id="desc">Belirli bir marka veya modelin birebir fotoğrafı olmayan, Expiya tarafından hazırlanmış ev ürünü illüstrasyonu</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0fdf4"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#334155"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1200" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="600" cy="390" r="300" fill="#fff" opacity=".74"/>
  <g filter="url(#shadow)" stroke="#065f46" stroke-width="10">
    <rect x="230" y="220" width="265" height="410" rx="34" fill="url(#metal)"/>
    <path d="M230 390h265" stroke="#6ee7b7" opacity=".7"/>
    <path d="M450 330v55M450 420v55" stroke="#d1fae5" stroke-linecap="round"/>
    <rect x="540" y="315" width="300" height="315" rx="38" fill="#f8fafc"/>
    <circle cx="690" cy="472" r="102" fill="#dbeafe" stroke="#10b981" stroke-width="18"/>
    <circle cx="690" cy="472" r="60" fill="#fff" stroke="#93c5fd" stroke-width="8"/>
    <circle cx="918" cy="510" r="115" fill="#0f172a"/>
    <path d="M842 520c55-78 112-91 170-33-23 78-80 115-170 33Z" fill="#34d399"/>
    <circle cx="918" cy="510" r="18" fill="#ecfdf5"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="748" font-size="38" font-weight="650" fill="#064e3b">Temsilî ev ürünü illüstrasyonu</text>
    <text x="600" y="798" font-size="25" fill="#475569">Ürünün birebir fotoğrafı değildir</text>
  </g>
</svg>
