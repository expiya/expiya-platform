    <circle cx="390" cy="594" r="39" fill="#cbd5e1"/><circle cx="830" cy="594" r="39" fill="#cbd5e1"/>
    <circle cx="390" cy="594" r="15" fill="#64748b"/><circle cx="830" cy="594" r="15" fill="#64748b"/>
    <rect x="247" y="511" width="78" height="25" rx="12" fill="#f8fafc" opacity=".9"/><rect x="895" y="511" width="78" height="25" rx="12" fill="#f8fafc" opacity=".9"/>
